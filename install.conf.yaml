- defaults:
    link:
      create: true
      relink: true

- clean:
    - ~/.dotfiles_local/
    - ~/bin/
    - ~/.config/
    - ~/.gitconfig_local
    - ~/.nvm/
    - ~/.shell_local_after

- link:
    ~/.dotfiles_local: ''
    ~/bin/:
      glob: true
      path: ~/.dotfiles_local/bin/*
    ~/.config/:
      glob: true
      path: ~/.dotfiles_local/config/*
    ~/.gitconfig_local: ~/.dotfiles_local/gitconfig_local
    ~/.nvm: ~/.dotfiles_local/nvm
    ~/.shell_local_after: ~/.dotfiles_local/shell_local_after
