- defaults:
    link:
      create: true
      relink: true

- clean:
    'agentic-genai/claude/skills':
        recursive: true

- link:
    'agentic-genai/claude/skills':
      glob: true
      path: "agentic-genai/agents/skills/*"

- clean:
    '~':
        recursive: false
    '~/.config':
        recursive: true
    '~/.nvm':
        recursive: false
    '~/.local/bin':
        recursive: false
    '~/.claude':
        recursive: true
    '~/.junie/skills':
        recursive: true

- link:
    ~/.dotfiles_local: ""
    ~/.agents: "agentic-genai/agents"
    ~/.claude/:
      glob: true
      path: "agentic-genai/claude/*"
    ~/.config/:
      glob: true
      path: "config/*"
    ~/.gitconfig_local:
    ~/.junie/skills/:
      glob: true
      path: "~/.agents/skills/*"
    ~/.local/bin/:
      glob: true
      path: "bin/*"
    ~/.shell_local_after:
    ~/.shell_local_after.ps1:
