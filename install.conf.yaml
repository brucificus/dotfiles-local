- defaults:
    link:
      create: true
      relink: true

- clean:
    - '~'
    - '~/.ssh/**'

- link:
    ~/.dotfiles_local: ''
    ~/.config/powershell/:
      glob: true
      path: powershell/*
    ~/AppData/Local/gh:
      glob: true
      path: config/gh/*
    ~/.ssh/:
      glob: true
      path: config/ssh/*
    ~/bin/:
      glob: true
      path: bin/*
