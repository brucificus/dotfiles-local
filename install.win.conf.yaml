- defaults:
    link:
      create: true
      relink: true

- clean:
    '~/.config/TortoiseGit':
      recursive: true
    '~/.config/WindowsTerminal':
      recursive: true
    '~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState':
      recursive: true
    '~/AppData/Roaming/Microsoft/Windows/Start Menu':
      recursive: true
    '~/AppData/Roaming/TortoiseGit':
      recursive: true
    '~/AppData/Local/Microsoft/PowerToys':
      recursive: true
    '~/AppData/Local/Microsoft/VisualStudio/17.0_982ce974/Settings/':
      recursive: true
    '~/.config/JetBrains/PyCharm':
      recursive: true

- link:
    ~/AppData/Local/Microsoft/PowerToys/FancyZones/:
      glob: true
      path: "config/Microsoft/PowerToys/FancyZones/*"
    ~/AppData/Local/Microsoft/PowerToys/PowerToys Run/:
      glob: true
      path: "config/Microsoft/PowerToys/PowerToys Run/Settings/*"
    ~/AppData/Local/Microsoft/VisualStudio/17.0_982ce974/Settings/CurrentSettings.vssettings:
      path: "config/Microsoft/VisualStudio/v17/CurrentSettings.vssettings"
    ~/AppData/Local/gh:
      glob: true
      path: "config/gh/*"
    ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup:
      glob: true
      path: "explorer-startup/*"
    ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState:
      path: "~/.config/WindowsTerminal"
    ~/AppData/Roaming/Elgato/StreamDeck/ProfilesV2:
      path: "config/ElgatoStreamDeck/profiles"
    ~/AppData/Roaming/TC-Helicon/GOXLR:
      path: "config/GoXLR/AppDataRoaming"
    ~/AppData/Roaming/TortoiseGit/:
      glob: true
      path: "config/TortoiseGit/*"
    ~/AppData/Roaming/JetBrains/PyCharm2024.2/c.pwd:
      path: "config/JetBrains/PyCharm/c.pwd"
    ~/AppData/Roaming/JetBrains/PyCharm2024.2/options:
      path: "config/JetBrains/PyCharm/options"
